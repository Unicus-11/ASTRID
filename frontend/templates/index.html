<!DOCTYPE html>
<html>

<head>
    <title>ASTRID SUMO Control</title>

    <style>

        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            margin-top: 30px;
            font-size: 20px;
        }

    </style>
</head>

<body>

    <h1>ASTRID Traffic Simulation</h1>

    <h2>SUMO Controller</h2>

    <button onclick="startSimulation()">
        START
    </button>

    <button onclick="stepSimulation()">
        STEP
    </button>

    <button onclick="stopSimulation()">
        STOP
    </button>

    <div id="status">
        Ready
    </div>


    <script>

        async function startSimulation() {

            const response =
                await fetch("/start", {
                    method: "POST"
                });

            const data =
                await response.json();

            document.getElementById("status")
                .innerText = data.status;

        }


        async function stepSimulation() {

            const response =
                await fetch("/step", {
                    method: "POST"
                });

            const data =
                await response.json();

            document.getElementById("status")
                .innerText =
                "Simulation time: " +
                data.time;

        }


        async function stopSimulation() {

            const response =
                await fetch("/stop", {
                    method: "POST"
                });

            const data =
                await response.json();

            document.getElementById("status")
                .innerText = data.status;

        }

    </script>

</body>

</html>
